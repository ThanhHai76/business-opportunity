  <script>
    // Apply the saved (or system) light/dark theme before first paint to avoid a flash. Keep in sync with ThemeService.
    (function () {
      var theme = 'light';
      try {
        var stored = localStorage.getItem('hanoi100.theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = stored === 'dark' || stored === 'light' ? stored : dark ? 'dark' : 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
