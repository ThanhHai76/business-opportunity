<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bản đồ Cơ hội Kinh doanh</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved (or system) light/dark theme before first paint to avoid a flash. Keep in sync with ThemeService.
    (function () {
      var theme = 'light';
      try {
        var stored = localStorage.getItem('hanoi100.theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = stored === 'dark' || stored === 'light' ? stored : dark ? 'dark' : 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,480;9..144,560;9..144,680&family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
