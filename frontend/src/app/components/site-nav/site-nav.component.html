<header class="site-nav">
  <a class="brand" routerLink="/" aria-label="Hà Nội 100 năm — trang chủ">
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
      <line x1="2" y1="22" x2="26" y2="22" stroke="currentColor" stroke-width="1.4" opacity=".35" />
      <rect x="9.8" y="13" width="1.5" height="8" fill="currentColor" />
      <rect x="16.7" y="13" width="1.5" height="8" fill="currentColor" />
      <rect x="8.4" y="12" width="11.2" height="1.6" fill="currentColor" />
      <circle cx="14" cy="8.7" r="2.4" fill="none" stroke="currentColor" stroke-width="1.3" />
      <rect x="7.5" y="5.2" width="13" height="1.4" fill="currentColor" />
      <polygon points="7.5,5.2 5,3.6 7.5,6.6" fill="currentColor" />
      <polygon points="20.5,5.2 23,3.6 20.5,6.6" fill="currentColor" />
      <circle cx="14" cy="4.2" r="0.9" fill="currentColor" />
    </svg>
    <span class="brand-word">Hà Nội 100 năm</span>
  </a>

  <div class="right">
  <nav class="tabs" aria-label="Chọn công cụ">
    @for (tab of tabs; track tab.path) {
      <a
        class="tab"
        [routerLink]="tab.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [style.--tab-accent]="'var(--app-' + tab.key + ')'"
      >
        <span class="dot" aria-hidden="true"></span>
        <span class="label-full">{{ tab.label }}</span>
        <span class="label-short">{{ tab.short }}</span>
      </a>
    }
  </nav>

  <button
    type="button"
    class="theme-toggle"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.effective() === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'"
    [title]="theme.effective() === 'dark' ? 'Giao diện sáng' : 'Giao diện tối'"
  >
    @if (theme.effective() === 'dark') {
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5a8.5 8.5 0 1 0 10.9 10.9z" />
      </svg>
    }
  </button>
  </div>
</header>
