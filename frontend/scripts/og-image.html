<!doctype html><meta charset="utf-8">
<style>
 html,body{margin:0}
 body{width:1200px;height:630px;display:grid;align-content:center;padding:0 90px;box-sizing:border-box;background:linear-gradient(135deg,#1f1b16 0%,#3a2d1d 60%,#7a5a2b 100%);color:#f6efe2;font-family:'Manrope','Segoe UI',Arial,sans-serif;position:relative;overflow:hidden}
 .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(246,239,226,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(246,239,226,.07) 1px,transparent 1px);background-size:60px 60px}
 .dot{position:absolute;right:140px;top:140px;width:26px;height:26px;border-radius:50%;background:#e8b04a;box-shadow:0 0 0 18px rgba(232,176,74,.25),0 0 0 48px rgba(232,176,74,.12)}
 p{position:relative;margin:0}
 .eyebrow{font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:#e8b04a;font-weight:700}
 h1{position:relative;margin:18px 0 22px;font-size:104px;line-height:1.02;font-family:Georgia,'Times New Roman',serif;font-weight:600}
 .sub{font-size:34px;line-height:1.35;max-width:880px;color:#e7dcc6}
</style>
<div class="grid"></div><div class="dot"></div>
<p class="eyebrow">Hà Nội · 2026</p>
<h1>Hanoi Century Vista</h1>
<p class="sub">Bản đồ cơ hội kinh doanh, cỗ máy thời gian và phân tích bất động sản cho Hà Nội.</p>
